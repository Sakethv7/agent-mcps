name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        package: [doc-tools, notebook-runner, git-context, data-tools]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies (doc-tools)
        if: matrix.package == 'doc-tools'
        run: sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install package
        run: uv pip install --system -e "${{ matrix.package }}[dev]"

      - name: Lint
        run: uv run ruff check ${{ matrix.package }}/src

      - name: Import check
        run: python -c "import ${{ matrix.package == 'doc-tools' && 'doc_tools' || matrix.package == 'notebook-runner' && 'notebook_runner' || matrix.package == 'git-context' && 'git_context' || 'data_tools' }}"

      - name: Run tests
        run: |
          if [ -d "${{ matrix.package }}/tests" ]; then
            uv run pytest ${{ matrix.package }}/tests -v
          else
            echo "No tests yet for ${{ matrix.package }} — skipping"
          fi
